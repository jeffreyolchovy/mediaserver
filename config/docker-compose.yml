services:
  duckdns:
    container_name: duckdns
    image: linuxserver/duckdns:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SUBDOMAINS=${DNS_SUBDOMAINS}
      - TOKEN=${DNS_TOKEN}
    volumes:
      - ${ROOT}/config/duckdns:/config

  vpn:
    container_name: vpn
    image: ghcr.io/utkuozdemir/dperson-openvpn-client:latest
    cap_add:
      - net_admin
    restart: unless-stopped
    environment:
      - OTHER_ARGS='--mute-replay-warnings'
    volumes:
      - /dev/net:/dev/net:z
      - ${ROOT}/config/vpn:/vpn
    security_opt:
      - label:disable
    ports:
      - 8112:8112
    command: "-r 192.168.1.0/24"

  deluge:
    container_name: deluge
    image: linuxserver/deluge:latest
    restart: unless-stopped
    network_mode: service:vpn
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${ROOT}/downloads:/downloads
      - ${ROOT}/config/deluge:/config

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    volumes:
      - /etc/localtime:/etc/localtime:ro

  jackett:
    container_name: jackett
    image: linuxserver/jackett:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ROOT}/downloads/torrent-blackhole:/downloads
      - ${ROOT}/config/jackett:/config
    depends_on:
      - flaresolverr

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ROOT}/config/sonarr:/config
      - ${ROOT}/complete/tv:/tv
      - ${ROOT}/downloads:/downloads

  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${ROOT}/config/radarr:/config
      - ${ROOT}/complete/movies:/movies
      - ${ROOT}/downloads:/downloads

  emby:
    container_name: emby
    image: emby/embyserver_arm64v8:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 8096:8096
    volumes:
      - ${ROOT}/config/emby:/config
      - ${ROOT}/config/emby/transcoding:/transcode
      - ${ROOT}/complete/tv:/data/tvshows
      - ${ROOT}/complete/movies:/data/movies
      - ${ROOT}/complete/shared/tv:/data/shared/tvshows
      - ${ROOT}/complete/shared/movies:/data/shared/movies

  samba:
    container_name: samba
    image: crazymax/samba
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - SAMBA_WORKGROUP=WORKGROUP
      - WSDD2_ENABLE=1
    volumes:
      - ${ROOT}/config/samba:/data
      - ${ROOT}:/extmedia
